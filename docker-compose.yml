services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deeppacketai
      POSTGRES_USER: deeppacket
      POSTGRES_PASSWORD: deeppacket
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeppacket -d deeppacketai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
